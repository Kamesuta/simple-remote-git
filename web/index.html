<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Git Graph</title>
<meta name="theme-color" id="theme-color" content="#FFFFFF">
<script>
  // テーマ(自動/ライト/ダーク)は描く前に決める。後から変えると開いた瞬間に色がちらつくため
  (function () {
    var pick = "auto";
    try { pick = localStorage.getItem("theme") || "auto"; } catch (e) {}
    var dark = pick === "dark" || (pick === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.dataset.pick = pick;
    document.getElementById("theme-color").content = dark ? "#16191D" : "#FFFFFF";
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Git Graph">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="title">
    <button type="button" id="theme" class="theme-btn" aria-label="テーマを切り替える">
      <svg class="mark" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="3"/><path d="M5 9v6"/><circle cx="5" cy="18" r="3"/><path d="M12 3v18"/><circle cx="19" cy="6" r="3"/><path d="M16 15.7A9 9 0 0 0 19 9"/></svg>
      <span id="theme-label" class="theme-label">自動</span>
    </button>
    <div class="names">
      <h1 id="repo-label">Git Graph</h1>
      <p id="repo-path"></p>
    </div>
    <button type="button" id="refresh" class="icon-btn" aria-label="今すぐ取得">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
  <nav id="repos" class="repos" aria-label="リポジトリ"></nav>
  <div id="status" class="status" data-state="idle" role="status" aria-live="polite">
    <svg class="st-icon st-done" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    <svg class="st-icon st-busy" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>
    <svg class="st-icon st-err" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg>
    <span id="status-text" class="st-text"></span>
    <button type="button" id="retry" class="retry">もう一度</button>
    <span id="count" class="count"></span>
  </div>
  <div class="bar" aria-hidden="true"></div>
</header>
<main id="graph" class="graph">
  <div class="lanes"><svg id="lanes" aria-hidden="true"></svg></div>
  <div id="rows"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
